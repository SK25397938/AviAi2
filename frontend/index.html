<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aviation Live Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root {
    --bg: #161412;
    --surface: #1e1b18;
    --surface-raised: #2a2622;
    --fg: #ddd5c8;
    --muted: #7d7468;
    --accent: #d4952a;
    --accent-dim: rgba(212, 149, 42, 0.13);
    --border: #332e28;
    --border-light: #3d3730;
    --danger: #c94432;
    --safe: #4a8c5c;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    margin: 0;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--fg);
}

body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    z-index: 10000;
}

#map {
    height: 100vh;
    width: 100vw;
}

.map-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
}

.map-bar__left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.map-bar__mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    color: var(--fg);
    letter-spacing: -0.5px;
    text-decoration: none;
}

.map-bar__mark:hover { color: var(--accent); }

.map-bar__sep {
    width: 1px;
    height: 20px;
    background: var(--border);
}

.map-bar__sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.map-bar__right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.btn {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding: 7px 20px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
}

.btn:hover { background: var(--accent); color: var(--bg); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn:active { background: #b87e20; }

#filters {
    position: absolute;
    top: 62px;
    left: 10px;
    background: var(--surface);
    color: var(--fg);
    padding: 16px 18px;
    z-index: 1000;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 11px;
    min-width: 160px;
}

#filters b {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 12px;
}

#filters label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    color: var(--fg);
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 0.5px;
    transition: color 0.15s;
}

#filters label:hover { color: var(--accent); }

#filters input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
}

#filters input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
}

#filters input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid var(--bg);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
}

#filters input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.fr24-label {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    color: var(--fg) !important;
    padding: 8px 12px !important;
    font-family: var(--font-mono) !important;
    font-size: 11px !important;
    border-radius: 2px !important;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6) !important;
    line-height: 1.7 !important;
}

.fr24-label b {
    color: var(--accent) !important;
    font-weight: 600 !important;
    font-size: 12px !important;
}

.leaflet-tooltip-top:before {
    border-top-color: var(--border) !important;
}

.leaflet-top {
    top: 56px !important;
}

.leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--fg) !important;
    border-color: var(--border) !important;
    width: 34px !important;
    height: 34px !important;
    line-height: 34px !important;
    font-size: 16px !important;
    transition: background 0.15s, color 0.15s;
}

.leaflet-control-zoom a:hover {
    background: var(--accent) !important;
    color: var(--bg) !important;
}

.leaflet-control-zoom {
    border: 1px solid var(--border) !important;
    border-radius: 2px !important;
    overflow: hidden;
    box-shadow: none !important;
}

.leaflet-control-attribution {
    background: rgba(22, 20, 18, 0.85) !important;
    color: var(--muted) !important;
    font-family: var(--font-mono) !important;
    font-size: 9px !important;
    letter-spacing: 0.5px;
    border-radius: 2px !important;
}

.leaflet-control-attribution a {
    color: var(--accent) !important;
}

@media (max-width: 640px) {
    .map-bar { padding: 0 12px; height: 44px; }
    .map-bar__sub { display: none; }
    .map-bar__sep { display: none; }
    .btn { padding: 6px 14px; font-size: 10px; }
    #filters { top: 54px; left: 8px; padding: 12px 14px; min-width: 140px; }
    .leaflet-top { top: 50px !important; }
}

@media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    #filters label { transition: none; }
    #filters input[type="checkbox"] { transition: none; }
    .leaflet-control-zoom a { transition: none; }
}
</style>
</head>

<body>

<header class="map-bar" role="banner">
    <div class="map-bar__left">
        <a href="/" class="map-bar__mark">AviAi</a>
        <span class="map-bar__sep"></span>
        <span class="map-bar__sub">Live Map</span>
    </div>
    <div class="map-bar__right">
        <a href="/" class="btn">Home</a>
    </div>
</header>

<div id="filters">
<b>Filters</b>
<label><input type="checkbox" id="showCruise" checked> Cruise</label>
<label><input type="checkbox" id="showClimb" checked> Climb</label>
<label><input type="checkbox" id="showTakeoff" checked> Takeoff</label>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

<script>
const map = L.map("map").setView([22.5, 78.9], 5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
}).addTo(map);

function createAircraftIcon() {
    return L.icon({
        iconUrl: "/map/plane.svg",
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });
}

function createSelectedAircraftIcon() {
    return L.icon({
        iconUrl: "/map/plane.svg",
        iconSize: [48, 48],
        iconAnchor: [24, 24]
    });
}

const aircraftMarkers = {};
const aircraftTrails = {};
const aircraftState = {};
let selectedAircraftId = null;
let ws = null;

const mpsToKnots = mps => mps ? (mps * 1.94384).toFixed(0) : "N/A";
const metersToFeet = m => m ? Math.round(m * 3.28084) : 0;
const normalizeLng = lng => ((lng + 540) % 360) - 180;

function altitudeColor(feet) {
    if (feet < 10000) return "#6aab78";
    if (feet < 30000) return "#d4952a";
    return "#c94432";
}

function updateAircraft(list) {
    requestAnimationFrame(() => {
        list.forEach(ac => aircraftState[ac.icao24] = ac);

        Object.values(aircraftState).forEach(ac => {
            if (ac.latitude == null || ac.longitude == null) return;

            const id = ac.icao24;
            const latlng = [ac.latitude, ac.longitude];
            const heading = ac.heading_deg || 0;
            const altFt = metersToFeet(ac.baro_altitude_m);
            const trailColor = altitudeColor(altFt);

            if (!aircraftMarkers[id]) {
                const marker = L.marker(latlng, {
                    icon: createAircraftIcon(),
                    rotationAngle: heading
                }).addTo(map);

                marker.bindTooltip(`
                    <b>${ac.callsign || "Unknown"}</b><br>
                    ${altFt} ft<br>
                    ${mpsToKnots(ac.velocity_mps)} kts<br>
                    HDG ${heading.toFixed(0)}°
                `, {
                    className: "fr24-label",
                    direction: "top",
                    offset: [0, -14],
                    opacity: 0.95
                });

                marker.on("click", () => {
                    if (selectedAircraftId && aircraftMarkers[selectedAircraftId]) {
                        aircraftMarkers[selectedAircraftId].setIcon(createAircraftIcon());
                    }
                    marker.setIcon(createSelectedAircraftIcon());
                    selectedAircraftId = id;
                });

                aircraftMarkers[id] = marker;

                aircraftTrails[id] = L.polyline([], {
                    color: trailColor,
                    weight: 2,
                    opacity: 0.9
                }).addTo(map);
            }

            aircraftMarkers[id].setLatLng(latlng);
            aircraftMarkers[id].setRotationAngle(heading);

            const trail = aircraftTrails[id];
            trail.setStyle({ color: trailColor });
            trail.addLatLng(latlng);

            if (trail.getLatLngs().length > 40) {
                trail.setLatLngs(trail.getLatLngs().slice(-40));
            }
        });
    });
}

function connectWebSocket() {
    if (ws) ws.close();

    const b = map.getBounds();
    ws = new WebSocket(
        `ws://127.0.0.1:8000/flights/ws` +
        `?north=${b.getNorth()}` +
        `&south=${b.getSouth()}` +
        `&east=${normalizeLng(b.getEast())}` +
        `&west=${normalizeLng(b.getWest())}`
    );

    ws.onmessage = e => {
        const data = JSON.parse(e.data);
        updateAircraft(data);
    };

    ws.onclose = () => {
        setTimeout(connectWebSocket, 500);
    };
}

connectWebSocket();
map.on("moveend", connectWebSocket);
</script>

</body>
</html>
