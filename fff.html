<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VABB SID/STAR Waypoints Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
        }
        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background-color: #1e1e1e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        #sidebar h1 {
            font-size: 1.4rem;
            color: #4db8ff;
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        #sidebar p {
            font-size: 0.8rem;
            color: #aaa;
        }
        #waypoint-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #waypoint-list li {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 4px;
            transition: background 0.2s;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        #waypoint-list li:hover {
            background-color: #333;
            color: #fff;
        }
        .wp-ident {
            font-weight: bold;
            color: #ffcc00;
        }
        .wp-dist {
            color: #888;
            font-size: 0.85rem;
        }
        
        /* Map Styling */
        #map {
            flex-grow: 1;
            height: 100vh;
            width: calc(100% - 320px);
        }
        
        /* Custom Marker Tooltip/Popup Styling */
        .leaflet-popup-content-wrapper {
            background-color: #2c2c2c;
            color: #fff;
            border-radius: 8px;
            border: 1px solid #555;
        }
        .leaflet-popup-tip {
            background-color: #2c2c2c;
        }
        .popup-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4db8ff;
            margin: 0 0 5px 0;
        }
        .popup-coords {
            font-family: 'Courier New', monospace;
            color: #ffcc00;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        .popup-info {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
        }

        /* Custom DivIcon for Waypoints */
        .waypoint-marker {
            background: transparent;
            border: none;
        }
        .waypoint-marker-inner {
            width: 12px;
            height: 12px;
            background: #ff3b3b;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .waypoint-label {
            position: absolute;
            left: 16px;
            top: -2px;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>VABB Waypoints</h1>
        <p>AIP Supplement 84/2020 (VABB SID/STAR) - Sec 5. Click a waypoint to zoom in.</p>
        <ul id="waypoint-list"></ul>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        //
